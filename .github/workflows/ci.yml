name: CI

on:
  push:
    # dev is where changes are integrated: every push there is tested, not only
    # the pull request that later brings it to main.
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

# The energyml crates come from crates.io, at the version Cargo.lock holds; the
# weekly canary builds against the main branch of energyml-rust instead.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Never `cargo fmt --all`: it would rewrite crates/generated/.
      - name: rustfmt, every hand-written crate (scripts/fmt.sh --check)
        run: bash scripts/fmt.sh --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -j 4 -- --test-threads=4

  # The HDF5 paths (`retp-cli/hdf5`), on a system HDF5. `--all-targets` does not
  # build the targets behind a feature that is off, so without this job nothing in
  # the CI compiles `hdf5`. Features are enabled through the workspace, never
  # `-p <crate>`, so the build matches the full suite. `retp mcp` (feature `mcp`)
  # is tested and linted here too: the release archives ship it. So is the live
  # session of the client (feature `live` of retp-client).
  hdf5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Test with HDF5 and MCP enabled
        run: cargo test --workspace -j 4 --features retp-cli/hdf5,retp-cli/mcp,retp-cli/editor,retp-client/live -- --test-threads=4
      - name: Clippy with HDF5 and MCP enabled
        run: cargo clippy --workspace --all-targets --features retp-cli/hdf5,retp-cli/mcp,retp-cli/editor,retp-client/live -- -D warnings

  # What the CLI archives and the wheels ship: HDF5 built from its sources
  # (`hdf5-static`, CMake and a C compiler). Checked here so that a breakage
  # shows on a pull request, not when a release is cut. Linux only; the release
  # workflows build every target.
  hdf5-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features retp-cli/hdf5-static

  # The ETP crates that the page uses must keep compiling for wasm.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check --target wasm32-unknown-unknown
          -p retp-avro -p retp-types -p retp-proto -p retp-client

  # Cross-audit: the committed fixtures were written by fastavro from the same
  # Avro schemas. Regenerate them here and require no difference, then decode
  # them with the Rust codec. The expected bytes come from a second, independent
  # implementation.
  fastavro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: the fixtures are compared byte for byte with what this version writes.
      - run: pip install fastavro==1.13.1
      - name: Regenerate the fixtures
        working-directory: crates/retp-tests/tests/fixtures
        run: |
          python make.py
          python make_json.py
          python defaults.py
          python unions.py
      - name: The committed fixtures must be what fastavro writes today
        run: git diff --exit-code -- crates/retp-tests/tests/fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --test crossaudit --test unions --test json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Each crate against its own rust-version (from the workspace's Cargo.toml).
      # The Python bridge is a cdylib built by maturin, not a library to check here.
      - run: cargo hack check --workspace --exclude retp-python --rust-version

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --exclude retp-python
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs

  # Relative links and anchors of README.md, docs/ (the ADRs included) and the
  # crates' documents. Offline: absolute URLs are not followed.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check-links.py

  # Secrets and personal data never enter this repository. Built from source rather than
  # gitleaks/gitleaks-action (licence key on organisation repos). TODO(verify): the
  # action's current major is v3.0.0 (Node 24).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks pinned to a release and checked against its published SHA-256 (`go install
      # ...@latest` broke on a module-path conflict of the upstream repository).
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan the working tree and the history
        run: |
          ./gitleaks dir . --redact --exit-code 1
          ./gitleaks git . --redact --exit-code 1
