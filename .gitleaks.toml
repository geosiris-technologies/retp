# gitleaks reads this file from the scanned directory; the default rules stay on.
[extend]
useDefault = true

# The OAuth tests quote the example values of RFC 6749 (§2.3.1, §5.1) and
# RFC 6750 (§4) verbatim: published in the RFCs, valid nowhere.
[[allowlists]]
description = "RFC 6749 and RFC 6750 example credentials"
regexes = [
    '''^mF_9\.B5f-4\.1JqM$''',
    '''^tGzv3JOkF0XG5Qx2TlKWIA$''',
    '''^2YotnFZFEjr1zCsicMWpAA$''',
    '''^7Fjfp0ZBr1KtDRbnfVdmIw$''',
]
