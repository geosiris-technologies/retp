# release-plz: version bumps, changelogs and crates.io publication.

[workspace]
changelog_update = true
git_release_enable = false
# Off for the 0.3.0 release: cargo-semver-checks builds each crate's published
# version as the baseline, and every published 0.2.0 needs energyml-storage 0.2.0,
# hence `zip = "^7"`, whose releases were all yanked (October 2026), so no baseline
# builds. The version comes from the conventional commits (`feat!` makes it 0.3.0).
# Back on once 0.3.0 is the baseline.
semver_check = false
# Tag format: <crate>-v<version> (for example retp-cli-v0.2.0). The workflows that
# publish the CLI archives, the image and the wheels listen for the GitHub release
# `vX.Y.Z`; release-cli.yml and docker.yml also accept a `retp-cli-v*` tag.
git_tag_name = "{{ package }}-v{{ version }}"
# Every dependency is on crates.io (the energyml crates included): the workspace
# publishes on its own.

[[package]]
name = "retp-tests"
# Never published (publish = false in its Cargo.toml): release-plz must agree.
publish = false
release = false
changelog_update = false

# The facade for the existing crates.io crate `etptypes`.
[[package]]
name = "etptypes"
# Not published for now: crates.io keeps etptypes 1.x (Cargo.toml says publish = false).
publish = false
release = false

# The Python bridge ships as wheels (python.yml), never to crates.io: release-plz must
# neither publish it nor tag it.
[[package]]
name = "retp-python"
publish = false
release = false
changelog_update = false
