[package]
name = "energyml-etp-store"
description = "The bridge: an ETP v1.2 dataspace behind EnergymlStorage, so that what reads a file reads a server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["etp", "energyml", "storage", "resqml", "dataspace"]
categories = ["network-programming", "science::geo"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/energyml-etp-store"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

[dependencies]
energyml-core = { workspace = true }
energyml-storage = { version = "0.2.0-alpha.4" }
retp-proto = { workspace = true }
retp-client = { workspace = true }
retp-types = { workspace = true }
energyml-domain = { version = "0.2.0-alpha.4" }
async-trait = "0.1"

[dev-dependencies]
serde_json = "1"
# The contract of the storage traits, played on an EtpStore (tests/contract.rs).
energyml-storage = { version = "0.2.0-alpha.4", features = ["contract"] }
energyml-geometry = { version = "0.2.0-alpha.4" }
energyml-eml-2-0 = { version = "0.2.0-alpha.4" }
energyml-resqml-2-0-1 = { version = "0.2.0-alpha.4" }
energyml-eml-2-3 = { version = "0.2.0-alpha.4" }
energyml-resqml-2-2 = { version = "0.2.0-alpha.4" }
# By path only, no `version`: cargo publish resolves a versioned dev-dependency on the
# registry (docs/releasing.md).
retp-avro = { path = "../retp-avro" }
futures-executor = "0.3"

# docs.rs builds on Linux with no native HDF5: every feature builds there.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
