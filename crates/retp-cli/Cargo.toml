[package]
name = "retp-cli"
description = "The `retp` command: try an ETP v1.2 server - probe it, open a session, list, read, download."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["etp", "energyml", "cli", "websocket", "geoscience"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"
homepage = "https://www.geosiris.com"
documentation = "https://docs.rs/retp-cli"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*", "NOTICE*"]

[[bin]]
name = "retp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# The MCP tools and their stdio server (feature `mcp`).
energyml-mcp = { version = "0.2.0", features = ["server"], optional = true }
clap = { version = "4.6", features = ["derive"] }
# Where the ETP crates' events go: stderr, through a subscriber of a few lines.
# `tracing-log` also installs the `log` to `tracing` bridge (`try_init`), for
# the dependencies (rustls...) that still write with `log`.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["tracing-log"] }
retp-proto = { workspace = true }
# `live`: the shell's session, driven by a task of its own (subscriptions).
retp-client = { workspace = true, features = ["live"] }
# The shell's line editor (feature `editor`): history, editing, what arrives
# printed above the prompt.
rustyline = { version = "18", optional = true }
retp-types = { workspace = true }
# The bridge, for `download-epc`: a dataspace packed as an EPC.
energyml-etp-store = { workspace = true }
energyml-storage = { version = "0.2.0" }
energyml-schemas = { version = "0.2.0", features = ["all"] }

[features]
default = []
# Write the arrays of a downloaded dataspace to HDF5. Needs the HDF5 C library
# at build time; without it `download-epc` refuses to write arrays and says so.
hdf5 = ["energyml-storage/hdf5"]
# HDF5 built from its sources and linked in (CMake and a C compiler at build time): the release archives.
hdf5-static = ["hdf5", "energyml-storage/hdf5-static"]
# `retp mcp`: the generic MCP tools of energyml-mcp over stdio, on one
# dataspace. Off by default: it brings tokio and the MCP SDK.
mcp = ["dep:energyml-mcp"]
# The shell's line editor: history, editing, and what arrives printed above
# the prompt. Off by default; without it the shell reads plain lines.
editor = ["dep:rustyline"]

[lints.rust]
missing_docs = "warn"

# docs.rs builds on Linux with no native HDF5: only features needing no native library are listed.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
