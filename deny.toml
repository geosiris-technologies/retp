# cargo-deny configuration. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
# A yanked crate is an error, not a warning.
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained (no vulnerability). It is a build-time proc-macro dependency of
    # hdf5-metno-derive (HDF5 bindings, behind the optional `hdf5` feature), which has no maintained
    # alternative today. Review when hdf5-metno moves off it.
    { id = "RUSTSEC-2026-0173", reason = "transitive, build-time only, via hdf5-metno-derive; no vulnerability" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # The HDF5 licence, of hdf5-metno-src (HDF5 built from its sources, behind the
    # `hdf5-static` feature of the CLI archives and the wheels). With all-features
    # on, the graph holds it as soon as `retp-cli` has that feature.
    "HDF5",
]
confidence-threshold = 0.8
# TODO(verify): run `cargo deny check licenses` on the tree with `hdf5-static` and add any
# other licence it reports and that is compatible with Apache-2.0 (energyml-rust also
# allows MIT-0, 0BSD, BSL-1.0 and Unlicense), and trim entries that stay unused.

# `ring` carries a mixed ISC/OpenSSL-style licence file that cargo-deny does
# not recognise by itself. TODO(verify): the hash is the one published in the
# cargo-deny documentation; confirm with `cargo deny check licenses`.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dev-dependencies on a crate of this repository are by path only, without a
# `version` (docs/releasing.md): not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
