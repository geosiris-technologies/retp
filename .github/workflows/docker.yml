# The public image ghcr.io/geosiris-technologies/retp (commands `retp` and
# `retp-conformance`), built and pushed by this repository's CI only.
#
# - pull request: build for linux/amd64, smoke-test, push nothing;
# - push to main: push `edge`;
# - a published release vX.Y.Z (the one that publishes everything, see
#   docs/releasing.md), or a tag retp-cli-vX.Y.Z: push `X.Y.Z`, `X.Y` and `latest`
#   (`latest` and `X.Y` not for a pre-release, GitHub's flag or a `-` in the version);
# - a tag retp-cli-vX.Y.Z-pre (a pre-release published from dev by release-plz, which
#   starts this workflow on it): push `X.Y.Z-pre` and `dev`.
#
# Nothing is pushed until the repository variable IMAGE_PUBLISH is 'true': until
# then main, tags and manual runs only build and smoke-test, as a pull request does.
#
# Each architecture builds on its own native runner (emulating arm64 under QEMU
# would take hours for a Rust build), pushes by digest, and a last job joins the
# digests into one multi-architecture manifest. A package created by a workflow
# starts private on GHCR: the organisation allows public packages, and the first
# push is followed by making the package public (docs/releasing.md).
name: docker

on:
  pull_request:
    paths: ["crates/**", "Cargo.*", "docker/**", ".github/workflows/docker.yml"]
  push:
    branches: [main]
    tags: ["retp-cli-v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/geosiris-technologies/retp

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            lto: fat
          # A fat-LTO release build outgrows the free arm64 runner (seen on energyml-rust).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            lto: thin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The tag names the version of the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The tag must name the version of the code it builds: a release `vX.Y.Z` created on a
          # commit still at another version would publish one version under the name of
          # another. crates.io and PyPI refuse it; so here.
          crate=$(python3 - <<'PY'
          import tomllib
          cli = tomllib.load(open("crates/retp-cli/Cargo.toml", "rb"))["package"]["version"]
          if isinstance(cli, dict):
              cli = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(cli)
          PY
          )
          tag="${GITHUB_REF_NAME#retp-cli-}"
          tag="${tag#v}"
          echo "tag=$tag retp-cli=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match retp-cli version $crate"
            exit 1
          fi
      - name: Version
        id: v
        run: |
          case "$GITHUB_REF" in
            refs/tags/retp-cli-v*) echo "version=${GITHUB_REF#refs/tags/retp-cli-v}" >> "$GITHUB_OUTPUT" ;;
            refs/tags/v*) echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=edge" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build (and push by digest outside pull requests)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            REVISION=${{ github.sha }}
            RELEASE_LTO=${{ matrix.lto }}
            VERSION=${{ steps.v.outputs.version }}
          load: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') }}
          tags: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') && 'retp:test' || '' }}
          outputs: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test
        if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true') }}
        run: docker run --rm retp:test --version
      - name: Export digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.IMAGE_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest` and `X.Y` belong to a stable version only: not to a GitHub pre-release,
      # nor to a version with a `-` (0.2.0-alpha.1).
      - name: Stable or pre-release
        id: kind
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          ver="${GITHUB_REF_NAME#retp-cli-}"
          ver="${ver#v}"
          if [ "$PRERELEASE" = true ] || [[ "$ver" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The patterns are anchored: unanchored, `retp-cli-v0.2.0-alpha.1` would also
          # yield the tag `0.2.0` of a stable version.
          tags: |
            type=edge,branch=main
            type=match,pattern=^retp-cli-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$,group=1
            type=match,pattern=^retp-cli-v(\d+\.\d+)\.\d+$,group=1,enable=${{ steps.kind.outputs.stable == 'true' }}
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1,enable=${{ steps.kind.outputs.stable == 'true' }}
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/tags/retp-cli-v') && steps.kind.outputs.stable != 'true' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && steps.kind.outputs.stable == 'true' }}
      - name: Join the digests into one manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Smoke test the published image
        run: docker run --rm ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} --version
