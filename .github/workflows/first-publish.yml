name: First publication

# One-off: the first version of each crate goes to crates.io with a short-lived
# token (crates.io trusted publishing can only be configured on a crate that
# already exists). Afterwards trusted publishing is set up per crate, the token
# is revoked, the CARGO_REGISTRY_TOKEN secret is deleted, this file is removed,
# and release-plz.yml publishes from then on (RELEASE_PLZ_PUBLISH = 'true').
#
# The workspace names the sibling ../energyml-rust by path (see ci.yml), so it is
# checked out next to this repository; `cargo publish` drops the path and each
# packaged crate is built against the energyml crates on crates.io.
#
# Only crates new to crates.io: a crate that already exists (`etptypes`, whatever
# its version) is an update, which the token cannot make and trusted publishing
# does (release-plz.yml). Rerunnable: a crate published by a previous run is skipped. crates.io
# limits how fast new crates are accepted (a burst, then one every few minutes);
# on a 429 the job waits until the time the registry gives, then goes on.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to crates.io (unchecked: package and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: first-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 360
    defaults:
      run:
        working-directory: retp
    steps:
      - uses: actions/checkout@v7
        with:
          path: retp
      - uses: actions/checkout@v7
        with:
          repository: geosiris-technologies/energyml-rust
          ref: main
          path: energyml-rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: retp

      # Every crate packaged and built from its package alone, in dependency
      # order, against a local copy of the registry: what crates.io would get.
      - name: Package and verify every crate (nothing is uploaded)
        run: cargo publish --workspace --dry-run --allow-dirty

      - name: Publish, in dependency order
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 - <<'EOF'
          import email.utils, json, re, subprocess, sys, time, urllib.error, urllib.request

          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              check=True, capture_output=True, text=True).stdout)
          crates = [(p["name"], p["version"]) for p in meta["packages"] if p.get("publish") != []]

          def on_registry(name, version):
              # The crate, not this version: an existing crate is not for this workflow.
              req = urllib.request.Request(f"https://crates.io/api/v1/crates/{name}",
                                           headers={"User-Agent": "retp first-publish"})
              try:
                  urllib.request.urlopen(req, timeout=30)
                  return True
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          for attempt in range(60):
              done = [n for n, v in crates if on_registry(n, v)]
              left = [n for n, _ in crates if n not in done]
              print(f"{len(done)} on crates.io, {len(left)} to publish", flush=True)
              if not left:
                  sys.exit(0)
              cmd = ["cargo", "publish", "--workspace", "--no-verify", "--allow-dirty"]
              for n in done:
                  cmd += ["--exclude", n]
              run = subprocess.run(cmd, capture_output=True, text=True)
              sys.stdout.write(run.stdout)
              sys.stderr.write(run.stderr)
              if run.returncode == 0:
                  continue
              if "429" not in run.stderr:
                  sys.exit(run.returncode)
              # "Please try again after <HTTP date>": wait until then.
              m = re.search(r"try again after (.+? GMT)", run.stderr)
              wait = 600
              if m:
                  wait = max(30, email.utils.parsedate_to_datetime(m.group(1)).timestamp() - time.time() + 15)
              print(f"rate limited: waiting {wait:.0f} s", flush=True)
              time.sleep(wait)
          sys.exit("still crates left after 60 rounds")
          EOF
