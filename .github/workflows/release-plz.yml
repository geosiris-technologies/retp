name: Release-plz

# Opens and maintains a release pull request (version bumps, changelogs), and
# publishes to crates.io when it is merged. Configuration: release-plz.toml.
#
# Publication uses crates.io trusted publishing (OIDC), like energyml-rust: no
# token is stored. The first publication of each crate is done by hand, then
# trusted publishing is configured per crate (docs/releasing.md).
#
# Both jobs run only once the repository variable RELEASE_PLZ_PUBLISH is 'true'.
# Leave it unset until every dependency is on crates.io: release-plz works on a
# copy of this repository alone, where the sibling ../energyml-rust the workspace
# depends on by path does not exist, so neither the release pull request nor
# `cargo publish` can succeed before.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pre-publication layout: sibling checkout by path, see ci.yml.
jobs:
  release-plz-pr:
    name: Release PR
    if: vars.RELEASE_PLZ_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: retp
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: geosiris-technologies/energyml-rust
          ref: main
          path: energyml-rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: retp/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    # Publishing is disabled until the energyml crates are on crates.io.
    if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_PLZ_PUBLISH == 'true' }}
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
      actions: write # start the tag workflows below (workflow_dispatch)
    steps:
      - uses: actions/checkout@v7
        with:
          path: retp
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: geosiris-technologies/energyml-rust
          ref: main
          path: energyml-rust
      - uses: dtolnay/rust-toolchain@stable
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: retp/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: the action exchanges the OIDC token for a
          # short-lived one (an empty value would be rejected, not ignored).

      # Tags pushed with GITHUB_TOKEN start no workflow (push events), but
      # workflow_dispatch started with GITHUB_TOKEN does run. So the release job
      # itself starts, on the new tag, the two workflows that listen for it. No
      # extra secret; the publish gates stay in those workflows (IMAGE_PUBLISH)
      # and in this job (RELEASE_PLZ_PUBLISH).
      - name: Start the tag workflows
        if: ${{ steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ steps.rp.outputs.releases }}
        run: |
          for tag in $(jq -r '.[].tag' <<< "$RELEASES" | grep '^retp-cli-v' || true); do
            gh workflow run release-cli.yml --ref "$tag"
            gh workflow run docker.yml --ref "$tag"
          done
