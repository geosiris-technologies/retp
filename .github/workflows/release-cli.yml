name: Release CLI

# Builds the `retp` command for the targets of the distribution plan and attaches
# one archive per target, with SHA256SUMS, to a GitHub release: the release `vX.Y.Z`
# (or the pre-release `vX.Y.Z-alpha.N`) a maintainer publishes, the one that
# publishes everything (see docs/releasing.md). A manual run
# (`gh workflow run release-cli.yml --ref <tag>`) rebuilds the archives of an
# existing release.

on:
  release:
    types: [published]
  # Must be run with `--ref <tag>`: the archive names and the release come from the ref.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # A manual run on a branch would build archives named after the branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version of the code
        shell: bash
        run: |
          # The tag must name the version of the code it builds: a release `vX.Y.Z` created on a
          # commit still at another version would publish one version under the name of
          # another. crates.io and PyPI refuse it; so here.
          crate=$(python3 - <<'PY'
          import tomllib
          cli = tomllib.load(open("crates/retp-cli/Cargo.toml", "rb"))["package"]["version"]
          if isinstance(cli, dict):
              cli = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(cli)
          PY
          )
          tag="${GITHUB_REF_NAME#retp-cli-}"
          tag="${tag#v}"
          echo "tag=$tag retp-cli=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match retp-cli version $crate"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features: hdf5-static` builds HDF5 from its sources and links it in (CMake is on
          # every runner image): the archive writes the arrays of `download-epc` on a machine
          # without HDF5. A target without it still downloads a dataspace and refuses by name
          # to write an array (FeatureNotEnabled). Every archive carries `retp mcp` (feature `mcp`).
          # TODO(verify): HDF5 for the musl targets (built with cross).
          # TODO(verify): the ARM runner label (ubuntu-24.04-arm) is available to this repository.
          # TODO(verify): ring and the HDF5 backend on Windows arm64.
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-22.04,     features: "hdf5-static,mcp", ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04-arm, features: "hdf5-static,mcp", ext: tar.gz }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-22.04,     features: mcp,         ext: tar.gz, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04,     features: mcp,         ext: tar.gz, musl: true }
          - { target: aarch64-apple-darwin,       os: macos-latest,     features: "hdf5-static,mcp", ext: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-latest,     features: "hdf5-static,mcp", ext: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   features: "hdf5-static,mcp", ext: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   features: "hdf5-static,mcp", ext: zip }
          # FreeBSD x86_64 is best-effort in the plan (via `cross`) and is not built here.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (musl and foreign-architecture Linux targets)
        if: matrix.musl
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      # The `dist` profile (Cargo.toml): thin LTO and 16 codegen units. The release
      # profile's fat LTO with one codegen unit ran the Windows and Linux arm64 runners
      # out of memory at link time. Only the binary that is shipped is built.
      - name: Build
        shell: bash
        run: |
          feat=""
          if [ -n "${{ matrix.features }}" ]; then feat="--features ${{ matrix.features }}"; fi
          if [ "${{ matrix.musl }}" = "true" ]; then
            cross build --profile dist --locked -p retp-cli --bin retp --target ${{ matrix.target }} $feat
          else
            cargo build --profile dist --locked -p retp-cli --bin retp --target ${{ matrix.target }} $feat
          fi
      - name: Package
        shell: bash
        run: |
          # The same name whether the run comes from `vX.Y.Z` or from `retp-cli-vX.Y.Z`.
          ver="${GITHUB_REF_NAME#retp-cli-}"
          ver="${ver#v}"
          name="retp-v$ver-${{ matrix.target }}"
          mkdir "$name"
          bin=retp
          if [ "${{ runner.os }}" = "Windows" ]; then bin=retp.exe; fi
          cp "target/${{ matrix.target }}/dist/$bin" "$name/"
          cp LICENSE NOTICE README.md "$name/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Attaches every archive to the GitHub release of the tag (created here when the
  # run comes from a tag with no release yet).
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # A published release keeps the notes its author wrote.
          generate_release_notes: ${{ github.event_name != 'release' }}
