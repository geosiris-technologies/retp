name: Release-plz

# Opens and maintains a release pull request (version bumps, changelogs), and
# publishes the crates to crates.io. Configuration: release-plz.toml.
#
# A published GitHub release `vX.Y.Z` is what publishes everything (docs/releasing.md):
# the crates here, and, from the same release, the CLI archives (release-cli.yml), the
# image (docker.yml) and the Python wheels (python.yml). Merging the release pull
# request publishes nothing.
#
# The repository variable RELEASE_PLZ_PUBLISH chooses: 'release' publishes on a
# release only (the setting to use); 'true' also publishes on a merge to main or dev;
# unset, nothing is published and no release pull request is opened. A release is
# checked first: its commit is on main or dev, and its tag names a version of the
# manifests. The `crates-io` environment accepts the branches main and dev and the
# tags `v*` and `*-v*`.
#
# Publication uses crates.io trusted publishing (OIDC): no token is stored. A push to
# dev publishes a pre-release set by hand in Cargo.toml (only with 'true'), without a
# release pull request, CLI binaries or image. A crate new to crates.io needs one
# publication with an API token first (docs/releasing.md).
#
# release-plz works on a copy of this repository alone: every dependency, the
# energyml crates included, comes from crates.io.

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

# One run at a time, but a release is never replaced by a push: GitHub keeps one
# pending run per group and cancels an older pending one, so the group names the
# event as well (a `release` run waiting behind a push run must not be dropped).
concurrency:
  group: release-plz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens the release pull request (versions, changelogs, semver check).
  release-plz-pr:
    name: Release PR
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'release' && (vars.RELEASE_PLZ_PUBLISH == 'true' || vars.RELEASE_PLZ_PUBLISH == 'release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with GITHUB_TOKEN starts its checks only once a
      # maintainer approves them. Opened by the release bot (a GitHub App: variable
      # RELEASE_BOT_CLIENT_ID, secret RELEASE_BOT_PRIVATE_KEY), its checks run like
      # those of any other pull request. Without the app, GITHUB_TOKEN.
      - id: bot
        if: ${{ vars.RELEASE_BOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The semver check builds each changed crate's rustdoc with all its features,
      # `hdf5` (and `hdf5-static`, which needs CMake: on the runner image) among them,
      # which links the HDF5 C library.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name != 'release' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && vars.RELEASE_PLZ_PUBLISH == 'true')
       || (github.event_name == 'release' && (vars.RELEASE_PLZ_PUBLISH == 'true' || vars.RELEASE_PLZ_PUBLISH == 'release')) }}
    environment: crates-io
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
      actions: write # start the tag workflows below (workflow_dispatch), outside a release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # A GitHub release publishes what its tag names, from the history of main or dev
      # only: `vX.Y.Z` (the workspace version) or `<crate>-vX.Y.Z`. Anything else is
      # refused before a single crate leaves. This also catches a release created on a
      # commit still at the previous version.
      - name: Check the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet origin main
          git fetch --quiet origin dev 2>/dev/null || true
          on_branch=no
          for b in main dev; do
            if git rev-parse -q --verify "origin/$b" >/dev/null && git merge-base --is-ancestor HEAD "origin/$b"; then
              on_branch=yes
            fi
          done
          if [ "$on_branch" != yes ]; then
            echo "::error::release $TAG: its commit is on neither main nor dev"
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "v\(.version)", "\(.name)-v\(.version)"' \
            | sort -u > versions.txt
          if ! grep -qxF "$TAG" versions.txt; then
            echo "::error::release $TAG names no version of the manifests (expected v<workspace version> or <crate>-v<version>)"
            exit 1
          fi
          rm versions.txt
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: the action exchanges the OIDC token for a
          # short-lived one (an empty value would be rejected, not ignored).

      # Tags pushed with GITHUB_TOKEN start no workflow (push events), but
      # workflow_dispatch started with GITHUB_TOKEN does run. So, on a merge that
      # publishes (RELEASE_PLZ_PUBLISH=true), the release job itself starts the two
      # workflows that listen for the new tag. No extra secret; the publish gates stay
      # in those workflows (IMAGE_PUBLISH) and in this job (RELEASE_PLZ_PUBLISH).
      - name: Start the tag workflows
        # Not from dev: a pre-release must not become the `latest` image. Not on a GitHub
        # release either: release-cli.yml, docker.yml and python.yml listen for the release
        # itself and attach to it; starting them here too would build everything twice.
        if: ${{ github.ref != 'refs/heads/dev' && github.event_name != 'release' && steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ steps.rp.outputs.releases }}
        run: |
          for tag in $(jq -r '.[].tag' <<< "$RELEASES" | grep '^retp-cli-v' || true); do
            gh workflow run release-cli.yml --ref "$tag"
            gh workflow run docker.yml --ref "$tag"
          done
