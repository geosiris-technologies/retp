name: Release-plz

# Versions, changelogs and crates.io, the GitHub way: nothing is published by a push.
#  - push to main: open (or update) the release pull request - the version bumps and
#    the CHANGELOG entries, written from conventional commits. Merging it publishes
#    nothing.
#  - a published GitHub release `vX.Y.Z` (docs/releasing.md) publishes everything:
#    the crates here, and, from the same release, the CLI archives (release-cli.yml),
#    the image (docker.yml) and the Python wheels (python.yml). A final release is
#    made on main; a pre-release `vX.Y.Z-alpha.N`, marked as a pre-release, on dev
#    (its version is set by hand there).
#
# The repository variable RELEASE_PLZ_PUBLISH is the switch: 'release' publishes on a
# GitHub release and opens the release pull request; unset (or anything else),
# nothing. A release is checked first: its tag names a version of the manifests, and
# its commit is on main (or on dev for a pre-release). The `crates-io` environment
# accepts the branches main and dev and the tags `v*` and `*-v*`.
#
# Publication uses crates.io trusted publishing (OIDC): no token is stored. A crate
# new to crates.io needs one publication with an API token first (docs/releasing.md).
#
# release-plz works on a copy of this repository alone: every dependency, the
# energyml crates included, comes from crates.io.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# One run at a time, but a release is never replaced by a push: GitHub keeps one
# pending run per group and cancels an older pending one, so the group names the
# event as well (a `release` run waiting behind a push run must not be dropped).
concurrency:
  group: release-plz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens the release pull request (versions, changelogs, semver check).
  release-plz-pr:
    name: Release PR
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'release' && vars.RELEASE_PLZ_PUBLISH == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with GITHUB_TOKEN starts its checks only once a
      # maintainer approves them. Opened by the release bot (a GitHub App: variable
      # RELEASE_BOT_CLIENT_ID, secret RELEASE_BOT_PRIVATE_KEY), its checks run like
      # those of any other pull request. Without the app, GITHUB_TOKEN.
      - id: bot
        if: ${{ vars.RELEASE_BOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The semver check builds each changed crate's rustdoc with all its features,
      # `hdf5` (and `hdf5-static`, which needs CMake: on the runner image) among them,
      # which links the HDF5 C library.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    # Only on a published GitHub release, once publishing is switched on.
    if: ${{ github.event_name == 'release' && vars.RELEASE_PLZ_PUBLISH == 'release' }}
    environment: crates-io
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # A GitHub release publishes what its tag names: `vX.Y.Z` (the workspace version)
      # or `<crate>-vX.Y.Z`. A final release comes from the history of main; a release
      # marked as a pre-release from main or dev. Anything else is refused before a
      # single crate leaves. This also catches a release created on a commit still at
      # the previous version.
      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git fetch --quiet origin main
          git fetch --quiet origin dev 2>/dev/null || true
          branches=main
          if [ "$PRERELEASE" = true ]; then branches="main dev"; fi
          on_branch=no
          for b in $branches; do
            if git rev-parse -q --verify "origin/$b" >/dev/null && git merge-base --is-ancestor HEAD "origin/$b"; then
              on_branch=yes
            fi
          done
          if [ "$on_branch" != yes ]; then
            echo "::error::release $TAG: its commit is not on $branches (a release from dev must be marked as a pre-release)"
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "v\(.version)", "\(.name)-v\(.version)"' \
            | sort -u > versions.txt
          if ! grep -qxF "$TAG" versions.txt; then
            echo "::error::release $TAG names no version of the manifests (expected v<workspace version> or <crate>-v<version>)"
            exit 1
          fi
          rm versions.txt
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: the action exchanges the OIDC token for a
          # short-lived one (an empty value would be rejected, not ignored).
