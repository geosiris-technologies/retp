name: Deny

# Daily: licences, advisories, bans and sources (deny.toml). The same check runs on
# every push and pull request in ci.yml, but a new advisory appears on a day nothing
# is pushed (four rustls advisories came out in one morning); this run shows it
# before a release does, and opens an issue.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check
      - name: Open an issue when the check fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Scheduled cargo-deny check failed
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$open" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The scheduled cargo-deny check failed: $RUN_URL"
          else
            echo "An issue is already open."
          fi
