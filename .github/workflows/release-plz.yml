name: Release-plz

# Opens and maintains a release pull request (version bumps, changelogs), and
# publishes to crates.io when it is merged. Configuration: release-plz.toml.
#
# Publication uses crates.io trusted publishing (OIDC), like energyml-rust: no
# token is stored. The publish job runs in the `crates-io` environment, which
# crates.io checks (each crate's trusted publisher names it) and which only `main`
# and `dev` may deploy to. A push to dev publishes a pre-release set by hand in
# Cargo.toml, without a release pull request, CLI binaries or image. A crate new to
# crates.io needs one publication with an API token first (docs/releasing.md).
#
# Both jobs run only once the repository variable RELEASE_PLZ_PUBLISH is 'true'.
# release-plz works on a copy of this repository alone: every dependency, the
# energyml crates included, comes from crates.io.
#
# A GitHub release (event `release: published`) publishes too, once its tag is
# checked against the manifests. The repository variable RELEASE_PLZ_PUBLISH
# chooses: 'true' publishes on a merge to main or dev and on a release; 'release'
# on a release only (the release pull request still prepares versions and
# changelogs); unset, nothing is published. The `crates-io` environment accepts
# the branches main and dev and the tags `v*` and `*-v*`.

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release-plz-pr:
    name: Release PR
    if: ${{ github.ref == 'refs/heads/main' && (vars.RELEASE_PLZ_PUBLISH == 'true' || vars.RELEASE_PLZ_PUBLISH == 'release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # A pull request opened with GITHUB_TOKEN starts its checks only once a
      # maintainer approves them. Opened by the release bot (a GitHub App: variable
      # RELEASE_BOT_CLIENT_ID, secret RELEASE_BOT_PRIVATE_KEY), its checks run like
      # those of any other pull request. Without the app, GITHUB_TOKEN.
      - id: bot
        if: ${{ vars.RELEASE_BOT_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The semver check builds each changed crate's rustdoc with all its features,
      # `hdf5` among them, which links the HDF5 C library.
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    if: >-
      ${{ (github.event_name != 'release' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && vars.RELEASE_PLZ_PUBLISH == 'true')
       || (github.event_name == 'release' && (vars.RELEASE_PLZ_PUBLISH == 'true' || vars.RELEASE_PLZ_PUBLISH == 'release')) }}
    environment: crates-io
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
      actions: write # start the tag workflows below (workflow_dispatch)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # A GitHub release publishes what its tag names, from the history of main or dev
      # only: `vX.Y.Z` (the workspace version) or `<crate>-vX.Y.Z`. Anything else is
      # refused before a single crate leaves.
      - name: Check the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet origin main
          git fetch --quiet origin dev 2>/dev/null || true
          on_branch=no
          for b in main dev; do
            if git rev-parse -q --verify "origin/$b" >/dev/null && git merge-base --is-ancestor HEAD "origin/$b"; then
              on_branch=yes
            fi
          done
          if [ "$on_branch" != yes ]; then
            echo "::error::release $TAG: its commit is on neither main nor dev"
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "v\(.version)", "\(.name)-v\(.version)"' \
            | sort -u > versions.txt
          if ! grep -qxF "$TAG" versions.txt; then
            echo "::error::release $TAG names no version of the manifests (expected v<workspace version> or <crate>-v<version>)"
            exit 1
          fi
          rm versions.txt
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: the action exchanges the OIDC token for a
          # short-lived one (an empty value would be rejected, not ignored).

      # Tags pushed with GITHUB_TOKEN start no workflow (push events), but
      # workflow_dispatch started with GITHUB_TOKEN does run. So the release job
      # itself starts, on the new tag, the two workflows that listen for it. No
      # extra secret; the publish gates stay in those workflows (IMAGE_PUBLISH)
      # and in this job (RELEASE_PLZ_PUBLISH).
      - name: Start the tag workflows
        # Not from dev nor a GitHub pre-release: a pre-release must not become the `latest` image.
        if: ${{ github.ref != 'refs/heads/dev' && !github.event.release.prerelease && steps.rp.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ steps.rp.outputs.releases }}
        run: |
          for tag in $(jq -r '.[].tag' <<< "$RELEASES" | grep '^retp-cli-v' || true); do
            gh workflow run release-cli.yml --ref "$tag"
            gh workflow run docker.yml --ref "$tag"
          done
