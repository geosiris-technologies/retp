[workspace]
resolver = "3"
members = [
    "crates/retp-proto",
    "crates/retp-avro",
    "crates/retp-derive",
    "crates/retp-client",
    "crates/energyml-etp-store",
    "crates/retp-conformance",
    "crates/retp-tests",
    "crates/retp-cli",
    "crates/retp-python",
    "crates/generated/*",
    "crates/etptypes",
]

[workspace.package]
version = "0.2.0-alpha.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/geosiris-technologies/retp"

# Speed-first release profile: fat LTO and one codegen unit also shrink the wasm module.
[profile.release]
lto = "fat"
codegen-units = 1

# What is distributed outside wasm (Python wheels, CLI archives): thin LTO, which
# a GitHub runner can link without running out of memory.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16

# Backtraces keep file and line; full debug info cost ~570 MB per test binary.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
tracing = "0.1"
energyml-log = { version = "0.2.0" }
energyml-core = { version = "0.2.0" }
retp-proto = { path = "crates/retp-proto", version = "0.2.0-alpha.3" }
retp-avro = { path = "crates/retp-avro", version = "0.2.0-alpha.3" }
retp-client = { path = "crates/retp-client", version = "0.2.0-alpha.3" }
energyml-etp-store = { path = "crates/energyml-etp-store", version = "0.2.0-alpha.3" }
retp-derive = { path = "crates/retp-derive", version = "0.2.0-alpha.3" }
retp-types = { path = "crates/generated/retp-types", version = "0.2.0-alpha.3" }
energyml-derive = { version = "0.2.0" }
energyml-storage = { version = "0.2.0" }
energyml-schemas = { version = "0.2.0" }
