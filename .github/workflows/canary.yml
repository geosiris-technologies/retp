name: Canary

# Weekly: build and test against the tip of energyml-rust, to learn early that a
# change over there breaks the bridge here.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The workspace takes the energyml crates from crates.io; here every one of them in
# the dependency graph is patched to the main branch of energyml-rust instead.

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Patch the energyml crates to energyml-rust main
        run: |
          mkdir -p .cargo
          echo '[patch.crates-io]' > .cargo/config.toml
          cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.source != null and (.source | startswith("registry+")) and (.name | startswith("energyml"))) | .name' \
            | sort -u \
            | while read -r name; do
                echo "$name = { git = \"https://github.com/geosiris-technologies/energyml-rust\", branch = \"main\" }" >> .cargo/config.toml
              done
          cat .cargo/config.toml
      - run: cargo test --workspace -j 4 -- --test-threads=4

      - name: Open an issue when the canary fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Canary against energyml-rust main failed" \
            --body "The weekly canary failed: $RUN_URL"
